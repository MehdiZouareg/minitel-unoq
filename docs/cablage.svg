  <text x="417" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2017">R1 · 1 kΩ</text>
  <line x1="770" y1="347" x2="700" y2="347" stroke="#2a2017" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="690" y="367" font-size="12" text-anchor="middle" fill="#2a2017">affichage écran</text>
  <rect x="812" y="60" width="172" height="330" rx="14" fill="#1b4f6b" stroke="#0e2f41" stroke-width="2"/>
  <text x="898" y="92" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">UNO Q</text>
  <g font-size="15" font-weight="700" fill="#fff">
    <circle cx="830" cy="120" r="7" fill="#c9b27a"/><text x="846" y="125">GND</text>
    <circle cx="830" cy="175" r="7" fill="#c9b27a"/><text x="846" y="180">3.3V</text>
    <circle cx="830" cy="235" r="7" fill="#c9b27a"/><text x="846" y="240">D0 · RX</text>
    <circle cx="830" cy="330" r="7" fill="#c9b27a"/><text x="846" y="335">D1 · TX</text>
  </g>
  <text x="898" y="365" text-anchor="middle" font-size="11" fill="#cfe3ee">UART logicielle</text>
  <text x="898" y="380" text-anchor="middle" font-size="11" fill="#cfe3ee">1200 bauds 7E1</text>
