<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 1000 410" role="img" aria-label="Schéma : masse DIN vers GND, une extrémité de la DIN vers D1 via 1 kilo-ohm, l'autre vers D0 via 1 kilo-ohm avec un pull-up de 10 kilo-ohms vers 3,3 V"><rect x="0" y="0" width="1000" height="410" fill="#fbf8f1"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a2017"/></marker>
    <g id="r1k"><rect x="0" y="-11" width="74" height="22" rx="10" fill="#e9d3a8" stroke="#2a2017"/><rect x="14" y="-11" width="7" height="22" fill="#7a4a1e"/><rect x="27" y="-11" width="7" height="22" fill="#111"/><rect x="40" y="-11" width="7" height="22" fill="#d22"/><rect x="56" y="-11" width="7" height="22" fill="#c9a227"/></g>
    <g id="r10k"><rect x="-11" y="0" width="22" height="64" rx="10" fill="#e9d3a8" stroke="#2a2017"/><rect x="-11" y="12" width="22" height="6" fill="#7a4a1e"/><rect x="-11" y="23" width="22" height="6" fill="#111"/><rect x="-11" y="34" width="22" height="6" fill="#f07c12"/><rect x="-11" y="48" width="22" height="6" fill="#c9a227"/></g>
  </defs>
  <rect x="14" y="40" width="250" height="350" rx="18" fill="#d9c6a6" stroke="#5b4636" stroke-width="2"/>
  <text x="139" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#3a2c1f">Minitel 1</text>
  <text x="139" y="92" text-anchor="middle" font-size="12" fill="#5b4636">prise DIN 5 broches (vue de face)</text>
  <circle cx="139" cy="235" r="78" fill="#3b3229" stroke="#1d1712" stroke-width="3"/>
  <circle cx="139" cy="235" r="66" fill="#26201a"/>
  <rect x="129" y="296" width="20" height="16" fill="#d9c6a6"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="94" cy="235" r="8" fill="#f4efe4"/><text x="70" y="240" fill="#f2b705">A</text>
    <circle cx="107" cy="203" r="7" fill="#8f877b"/><text x="96" y="190" fill="#bdb3a3" font-size="11">4</text>
    <circle cx="139" cy="190" r="8" fill="#f4efe4"/><text x="156" y="183" fill="#f2b705">2</text>
    <circle cx="171" cy="203" r="7" fill="#8f877b"/><text x="182" y="190" fill="#bdb3a3" font-size="11">5</text>
    <circle cx="184" cy="235" r="8" fill="#f4efe4"/><text x="184" y="262" fill="#f2b705">B</text>
  </g>
  <text x="139" y="358" text-anchor="middle" font-size="12" fill="#3a2c1f">2 = masse (milieu de l'arc)</text>
  <text x="139" y="375" text-anchor="middle" font-size="12" fill="#3a2c1f">A, B = broches 1 et 3 · 4, 5 libres</text>
  <path d="M139 190 V120 H812" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
  <text x="470" y="110" font-size="13" fill="#2a2017">masse commune</text>
  <path d="M600 175 H812" fill="none" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
  <text x="640" y="166" font-size="13" fill="#d62828">3,3 V</text>
  <path d="M184 235 H380" fill="none" stroke="#1f9d55" stroke-width="4" stroke-linecap="round"/>
  <use href="#r1k" x="380" y="235"/>
  <path d="M454 235 H812" fill="none" stroke="#1f9d55" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="235" r="6" fill="#1f9d55"/>
  <use href="#r10k" x="600" y="173"/>
  <text x="417" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2017">R2 · 1 kΩ</text>
  <text x="628" y="215" font-size="13" font-weight="700" fill="#2a2017">R3 · 10 kΩ</text>
  <line x1="700" y1="252" x2="770" y2="252" stroke="#2a2017" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="690" y="272" font-size="12" text-anchor="middle" fill="#2a2017">touches du Minitel</text>
  <path d="M94 235 V330 H380" fill="none" stroke="#f08a00" stroke-width="4" stroke-linecap="round"/>
